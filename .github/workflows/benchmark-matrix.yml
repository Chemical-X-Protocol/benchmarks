name: Chemical X Benchmark Evaluation Matrix

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tasks/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'AI Coding Agent Model'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'claude-3-7-sonnet'
          - 'gemini-2-5-pro'
          - 'gpt-4o'
          - 'grok-2'
      architecture:
        description: 'Architectural Target Branch'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'monolith'
          - 'chemical-x'
      task:
        description: 'Benchmark Task'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'task-a'
          - 'task-b'
          - 'task-c'
          - 'task-d'
          - 'task-e'

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark-orchestration:
    uses: HalloftheGods/.github/.github/workflows/chemical-x-benchmark-matrix.yml@main
    with:
      model: ${{ github.event.inputs.model || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      task: ${{ github.event.inputs.task || 'all' }}
      is_pr: ${{ github.event_name == 'pull_request' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
