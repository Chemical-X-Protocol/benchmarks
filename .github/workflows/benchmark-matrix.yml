name: Chemical X Benchmark Evaluation Matrix

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tasks/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'AI Coding Agent Model'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'claude-3-7-sonnet'
          - 'gemini-2-5-pro'
          - 'gpt-4o'
          - 'grok-2'
      architecture:
        description: 'Architectural Target Branch'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'monolith'
          - 'chemical-x'
      task:
        description: 'Benchmark Task'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'task-a'
          - 'task-b'
          - 'task-c'
          - 'task-d'
          - 'task-e'

permissions:
  contents: write
  pull-requests: write

jobs:
  static-hazard-audit:
    name: AST Context Hazard Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js with dependency caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AST context audit
        run: npx ts-node scripts/audit-context-risk.ts --json > audit-report.json || true

      - name: Output Audit Results to Step Summary
        run: |
          echo "## Static Architectural Context Hazard Audit" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat audit-report.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  benchmark-matrix:
    name: ${{ matrix.model }} on ${{ matrix.architecture }}
    needs: [static-hazard-audit]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [claude-3-7-sonnet, gemini-2-5-pro, gpt-4o, grok-2]
        architecture: [monolith, chemical-x]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js with dependency caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark matrix runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          MODEL_CHOICE="${{ github.event.inputs.model }}"
          ARCH_CHOICE="${{ github.event.inputs.architecture }}"
          TASK_CHOICE="${{ github.event.inputs.task }}"

          if [ "$MODEL_CHOICE" != "all" ] && [ "$MODEL_CHOICE" != "${{ matrix.model }}" ]; then
            echo "Skipping matrix run for model ${{ matrix.model }}"
            exit 0
          fi

          if [ "$ARCH_CHOICE" != "all" ] && [ "$ARCH_CHOICE" != "${{ matrix.architecture }}" ]; then
            echo "Skipping matrix run for architecture ${{ matrix.architecture }}"
            exit 0
          fi

          npx ts-node scripts/run-benchmark.ts --model=${{ matrix.model }} --target=${{ matrix.architecture }} --task=$TASK_CHOICE

      - name: Upload Matrix Job Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ matrix.model }}-${{ matrix.architecture }}
          path: benchmarks/results/*.json

  aggregate-and-publish:
    name: Aggregate Benchmark Results
    needs: [benchmark-matrix]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js with dependency caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Aggregate results across matrix jobs and publish to step summary
        run: |
          mkdir -p benchmarks/results
          find downloaded-artifacts -type f -name "*.json" -exec cp {} benchmarks/results/ \;
          npx ts-node scripts/aggregate-benchmark-summary.ts benchmarks/results
